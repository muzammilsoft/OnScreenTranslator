name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
      - develop
      - '**'
    tags:
      - 'v*'
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Environment Files
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found in repository. Generating wrapper..."
            gradle wrapper || true
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Prepare or Auto-Generate Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using provided repository secret keystore..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/keystore.jks
            echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No repository keystore found. Generating standalone release keystore..."
            keytool -genkeypair -v \
              -keystore /tmp/keystore.jks \
              -alias releaseKey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass androidreleasepass \
              -keypass androidreleasepass \
              -dname "CN=ZoolAI, OU=Mobile, O=ZoolAI, L=Khartoum, S=Khartoum, C=SD"
            echo "KEY_PASSWORD=androidreleasepass" >> $GITHUB_ENV
            echo "KEY_ALIAS=releaseKey" >> $GITHUB_ENV
            echo "STORE_PASSWORD=androidreleasepass" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi
        env:
          STORE_FILE: /tmp/keystore.jks
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          REF_NAME="${{ github.ref_name }}"
          CLEAN_NAME=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "Error: No release APK found!"
            exit 1
          fi
          echo "Found APK at $APK_SRC"
          OUT_NAME="OnScreenTranslator-${CLEAN_NAME}-release.apk"
          cp "$APK_SRC" "$OUT_NAME"
          echo "FINAL_APK=$OUT_NAME" >> $GITHUB_ENV

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_APK }}
          path: ${{ env.FINAL_APK }}
          retention-days: 14

      - name: Upload APK to GitHub Release (If Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FINAL_APK }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true

